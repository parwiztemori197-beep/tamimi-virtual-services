<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات مجازی تیموری | Tamimi Virtual Services</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; }
        
        :root {
            --bg: #0a0a0a; --box: #151515; --gold: #d4af37; --text: #fff; --gray: #888;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05), transparent 60%);
            color: var(--text);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* صفحه خوش‌آمدگویی */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 1s ease;
        }
        #welcome-screen h1 { color: var(--gold); font-size: 32px; margin-bottom: 10px; text-shadow: 0 0 20px var(--gold); }
        #welcome-screen p { color: var(--gray); font-size: 16px; margin-bottom: 30px; }
        #enter-btn { background: linear-gradient(135deg, #d4af37, #b8860b); color: #111; border: none; padding: 15px 40px; border-radius: 30px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        #enter-btn:active { transform: scale(0.95); }

        /* هدر سایت */
        .header { width: 100%; max-width: 600px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: var(--gold); font-size: 20px; }
        .wallet-btn { background: var(--box); border: 1px solid var(--gold); color: var(--gold); padding: 8px 15px; border-radius: 10px; font-size: 12px; cursor: pointer; text-decoration: none; }

        /* محتوای اصلی */
        .main-content { width: 100%; max-width: 600px; padding: 0 20px 20px; display: none; }
        
        .section-title { color: var(--gold); font-size: 16px; margin: 20px 0 10px; border-right: 3px solid var(--gold); padding-right: 10px; }

        .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .service-card {
            background: var(--box); border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px; padding: 20px; text-align: center; cursor: pointer;
            transition: all 0.3s;
        }
        .service-card:active { transform: scale(0.95); border-color: var(--gold); }
        .service-card .icon { font-size: 40px; margin-bottom: 10px; }
        .service-card h3 { font-size: 15px; color: #fff; }

        /* صفحه محصولات */
        #products-page { display: none; }
        .product-item { background: var(--box); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .product-item h4 { font-size: 14px; margin-bottom: 5px; }
        .product-item span { color: var(--gold); font-size: 13px; }
        .product-item button { background: var(--gold); color: #111; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        /* صفحه جزئیات سفارش */
        #order-page { display: none; background: var(--box); padding: 20px; border-radius: 15px; border: 1px solid var(--gold); }
        .order-page h2 { color: var(--gold); margin-bottom: 10px; }
        .order-page p { color: var(--gray); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .order-input { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 8px; margin-bottom: 15px; font-family: inherit; }
        .order-btn { width: 100%; background: #25D366; color: #fff; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }

        /* پنل مدیریت مخفی */
        #admin-panel { display: none; background: #111; padding: 20px; border-radius: 15px; margin-top: 20px; border: 2px dashed red; }
        #admin-panel h3 { color: red; margin-bottom: 15px; }
        #admin-panel input { width: 100%; padding: 10px; margin-bottom: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; }
        #admin-panel button { background: red; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: 700; }

        .back-btn { display: inline-block; color: var(--gray); margin-bottom: 15px; cursor: pointer; font-size: 14px; }
        .back-btn:hover { color: var(--gold); }
    </style>
</head>
<body>

    <!-- صفحه خوش‌آمدگویی -->
    <div id="welcome-screen">
        <h1>خدمات مجازی تیموری</h1>
        <p>خرید و فروش خدمات دیجیتال و بازی</p>
        <button id="enter-btn" onclick="enterSite()">ورود به سایت</button>
    </div>

    <!-- هدر -->
    <div class="header">
        <h1>خدمات تیموری</h1>
        <a href="#" class="wallet-btn" onclick="showWallet()">💰 افزایش موجودی</a>
    </div>

    <!-- محتوای اصلی (خانه) -->
    <div class="main-content" id="home-page">
        <div class="section-title">دسته‌بندی خدمات</div>
        <div class="services-grid">
            <div class="service-card" onclick="showProducts('telegram')">
                <div class="icon">✈️</div>
                <h3>خدمات تلگرام</h3>
            </div>
            <div class="service-card" onclick="showProducts('instagram')">
                <div class="icon">📸</div>
                <h3>خدمات اینستاگرام</h3>
            </div>
            <div class="service-card" onclick="showProducts('tiktok')">
                <div class="icon">🎵</div>
                <h3>خدمات تیک‌تاک</h3>
            </div>
            <div class="service-card" onclick="showProducts('youtube')">
                <div class="icon">▶️</div>
                <h3>خدمات یوتیوب</h3>
            </div>
            <div class="service-card" onclick="showProducts('pubg')">
                <div class="icon">🎮</div>
                <h3>پابجی موبایل</h3>
            </div>
        </div>

        <!-- پنل مدیریت مخفی (با کلیک روی خط پایین باز میشه) -->
        <div style="text-align: center; margin-top: 50px; color: #333; cursor: pointer;" onclick="openAdmin()">...</div>
        
        <div id="admin-panel">
            <h3>پنل مدیریت (مخصوص مدیر)</h3>
            <input type="text" id="p-category" placeholder="دسته (مثلا telegram)">
            <input type="text" id="p-title" placeholder="نام محصول">
            <input type="number" id="p-price" placeholder="قیمت (مثلا 500)">
            <input type="text" id="p-desc" placeholder="توضیحات محصول">
            <button onclick="addProduct()">افزودن محصول</button>
            <button style="background: #333; margin-top: 10px;" onclick="clearProducts()">پاک کردن همه محصولات</button>
        </div>
    </div>

    <!-- صفحه نمایش محصولات -->
    <div class="main-content" id="products-page">
        <div class="back-btn" onclick="goBack()">🔙 بازگشت</div>
        <div class="section-title" id="products-title">محصولات</div>
        <div id="product-list"></div>
    </div>

    <!-- صفحه ثبت سفارش -->
    <div class="main-content" id="order-page">
        <div class="back-btn" onclick="goBack()">🔙 بازگشت</div>
        <h2 id="order-title"></h2>
        <p id="order-desc"></p>
        <input type="number" class="order-input" id="order-qty" placeholder="تعداد را وارد کنید" min="1" value="1" oninput="calculateTotal()">
        <p style="color: var(--gold); margin-bottom: 15px;">مبلغ کل: <span id="total-price">0</span> افغانی</p>
        <button class="order-btn" onclick="submitOrder()">ثبت سفارش و ارسال به واتساپ</button>
    </div>

<script>
    // --- تنظیمات اولیه ---
    let products = JSON.parse(localStorage.getItem('tamimi_products')) || [];
    let currentProduct = null;

    // --- صفحه خوش‌آمدگویی ---
    function enterSite() {
        document.getElementById('welcome-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
        }, 1000);
    }

    // --- جابجایی صفحات ---
    function hideAllPages() {
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('products-page').style.display = 'none';
        document.getElementById('order-page').style.display = 'none';
    }

    function goBack() {
        hideAllPages();
        document.getElementById('home-page').style.display = 'block';
    }

    // --- نمایش محصولات بر اساس دسته ---
    function showProducts(category) {
        hideAllPages();
        document.getElementById('products-page').style.display = 'block';
        
        let catName = {
            'telegram': 'خدمات تلگرام', 'instagram': 'خدمات اینستاگرام',
            'tiktok': 'خدمات تیک‌تاک', 'youtube': 'خدمات یوتیوب', 'pubg': 'پابجی موبایل'
        }[category];

        document.getElementById('products-title').innerText = catName;
        
        let list = document.getElementById('product-list');
        list.innerHTML = '';

        let filtered = products.filter(p => p.category === category);

        if (filtered.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">هنوز محصولی در این دسته ثبت نشده است.</p>';
            return;
        }

        filtered.forEach(p => {
            list.innerHTML += `
                <div class="product-item">
                    <div>
                        <h4>${p.title}</h4>
                        <span>${p.price} افغانی</span>
                    </div>
                    <button onclick="openOrder('${p.id}')">خرید</button>
                </div>
            `;
        });
    }

    // --- صفحه جزئیات سفارش ---
    function openOrder(id) {
        hideAllPages();
        currentProduct = products.find(p => p.id === id);
        document.getElementById('order-page').style.display = 'block';
        
        document.getElementById('order-title').innerText = currentProduct.title;
        document.getElementById('order-desc').innerText = currentProduct.desc || 'توضیحاتی برای این محصول ثبت نشده است.';
        document.getElementById('order-qty').value = 1;
        calculateTotal();
    }

    // --- محاسبه قیمت ---
    function calculateTotal() {
        if (!currentProduct) return;
        let qty = parseInt(document.getElementById('order-qty').value) || 1;
        let total = qty * parseInt(currentProduct.price);
        document.getElementById('total-price').innerText = total;
    }

    // --- ارسال سفارش به واتساپ ---
    function submitOrder() {
        let qty = document.getElementById('order-qty').value;
        let total = document.getElementById('total-price').innerText;
        let msg = `سلام، من از سایت خدمات تیموری یک سفارش دارم:%0A%0A📦 محصول: ${currentProduct.title}%0A🔢 تعداد: ${qty}%0A💰 مبلغ کل: ${total} افغانی%0A%0Aلطفا راهنمایی کنید.`;
        
        // شماره واتساپ مدیر (پرویز تیموری - 0771091599)
        window.open(`https://wa.me/93771091599?text=${msg}`, '_blank');
    }

    // --- دکمه افزایش موجودی ---
    function showWallet() {
        alert('برای افزایش موجودی، لطفاً مبلغ را به حساب‌های زیر واریز کنید و رسید را در واتساپ ارسال کنید.\n\nعزیزی بانک: 5512 7000 5385 0306\nحساب پی: 0796936833\nمومو: 0771091599');
    }

    // --- پنل مدیریت مخفی ---
    function openAdmin() {
        let pass = prompt("رمز عبور پنل مدیریت را وارد کنید:");
        if (pass === "1234") { // رمز عبور پیش فرض
            document.getElementById('admin-panel').style.display = 'block';
        } else if (pass !== null) {
            alert('رمز اشتباه است!');
        }
    }

    function addProduct() {
        let cat = document.getElementById('p-category').value;
        let title = document.getElementById('p-title').value;
        let price = document.getElementById('p-price').value;
        let desc = document.getElementById('p-desc').value;

        if (!cat || !title || !price) {
            alert('لطفاً دسته، نام و قیمت را وارد کنید.');
            return;
        }

        products.push({
            id: Date.now().toString(),
            category: cat,
            title: title,
            price: price,
            desc: desc
        });

        localStorage.setItem('tamimi_products', JSON.stringify(products));
        alert('محصول با موفقیت اضافه شد!');
        
        document.getElementById('p-category').value = '';
        document.getElementById('p-title').value = '';
        document.getElementById('p-price').value = '';
        document.getElementById('p-desc').value = '';
    }

    function clearProducts() {
        if (confirm('آیا مطمئن هستید که می‌خواهید تمام محصولات را پاک کنید؟')) {
            products = [];
            localStorage.setItem('tamimi_products', JSON.stringify(products));
            alert('همه محصولات پاک شدند.');
        }
    }
</script>
</body>
</html>
